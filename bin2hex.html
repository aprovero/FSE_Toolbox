<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>32-bit Binary to Hex Converter</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .bit-grid {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .column {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bit-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .bit-box {
      width: 20px;
      height: 20px;
      background-color: white;
      border: 2px solid #333;
      text-align: center;
      line-height: 18px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .bit-box.active {
      background-color: #0c0;
      color: white;
    }
    .bit-label {
      width: 20px;
      text-align: right;
      font-size: 12px;
    }
    .bit-desc {
      font-size: 12px;
      width: 180px;
    }
    .output, .input-group {
      margin-bottom: 10px;
    }
    input[type="text"] {
      font-family: monospace;
      font-size: 1em;
      padding: 4px;
      width: 150px;
    }
  </style>
</head>
<body>
  <h2>32-bit Binary to Hex Converter</h2>
  <div class="bit-grid">
    <div class="column" id="leftColumn"></div>
    <div class="column" id="rightColumn"></div>
  </div>

  <div class="output">
    <strong>Hex Value:</strong>
    <span id="hexOutput">0x00000000</span>
  </div>

  <div class="input-group">
    <label for="hexInput"><strong>Enter Hex Value:</strong></label>
    <input type="text" id="hexInput" placeholder="0xFF00AACC" oninput="applyHex()" />
    <button onclick="resetAll()">Reset</button>
  </div>

  <script>
    const leftColumn = document.getElementById("leftColumn");
    const rightColumn = document.getElementById("rightColumn");
    const hexOutput = document.getElementById("hexOutput");
    const bits = [];

    const descriptions = [
      "Inverter overvoltage", "Bus undervoltage", "Bus overvoltage", "Grounding fault",
      "Hardware fault", "Temperature abnormal", "Frequency abnormal", "AC overcurrent",
      "DC overcurrent", "Detection fuse fault", "DC fuse fault", "Fan fault",
      "GFDI protection", "Reserved", "Overload protection", "AC Leakage current protection",
      "DC Leakage current protection", "Transformer overtemperature", "Reactor overtemperature", "Module overtemperature",
      "PDP Protection", "Sensor failure", "Islanding protection", "Contactor fault",
      "Over frequency", "Under frequency", "AC Overvoltage", "AC Undervoltage",
      "DC Overvoltage", "DC Undervoltage", "Reserved", "Fault"
    ];

    for (let i = 31; i >= 0; i--) {
      const bitRow = document.createElement("div");
      bitRow.className = "bit-row";

      const label = document.createElement("div");
      label.className = "bit-label";
      label.textContent = i;

      const bit = document.createElement("div");
      bit.className = "bit-box";
      bit.textContent = "0";
      bit.dataset.index = i;
      bit.addEventListener("click", () => toggleBit(i));
      bits[i] = bit;

      const desc = document.createElement("div");
      desc.className = "bit-desc";
      desc.textContent = descriptions[i];

      bitRow.appendChild(label);
      bitRow.appendChild(bit);
      bitRow.appendChild(desc);

      if (i >= 16) {
        leftColumn.appendChild(bitRow);
      } else {
        rightColumn.appendChild(bitRow);
      }
    }

    function toggleBit(index) {
      const bit = bits[index];
      if (bit.classList.contains("active")) {
        bit.classList.remove("active");
        bit.textContent = "0";
      } else {
        bit.classList.add("active");
        bit.textContent = "1";
      }
      updateHex();
    }

    function updateHex() {
      let value = 0;
      for (let i = 0; i < 32; i++) {
        if (bits[i].classList.contains("active")) {
          value |= 1 << i;
        }
      }
      hexOutput.textContent = "0x" + value.toString(16).padStart(8, "0").toUpperCase();
    }

    function applyHex() {
      const input = document.getElementById("hexInput").value.trim();
      let hex = input.replace(/^0x/i, "");
      if (!/^[0-9a-fA-F]{1,8}$/.test(hex)) {
        return;
      }
      let value = parseInt(hex, 16);
      for (let i = 0; i < 32; i++) {
        if (value & (1 << i)) {
          bits[i].classList.add("active");
          bits[i].textContent = "1";
        } else {
          bits[i].classList.remove("active");
          bits[i].textContent = "0";
        }
      }
      updateHex();
    }

    function resetAll() {
      for (let i = 0; i < 32; i++) {
        bits[i].classList.remove("active");
        bits[i].textContent = "0";
      }
      updateHex();
    }

    updateHex();
  </script>
</body>
</html>
